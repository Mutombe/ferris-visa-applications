services:
  - type: web
    runtime: static
    name: ferris-visa-applications
    staticPublishPath: .
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      # long-lived caching for fingerprint-stable assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    routes:
      # extensionless URLs -> the .html file
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /complaints
        destination: /complaints.html
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /destinations
        destination: /destinations.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /apply
        destination: /apply.html
